name: Generate articles

on:
  schedule:
    - cron: "0 6 * * 1-5"   # European run, before the European open (Mon-Fri, UTC)
    - cron: "30 12 * * 1-5" # US run, before the US open (Mon-Fri, UTC)
    - cron: "0 8 * * 6"     # Saturday: one educational "Learn" guide
  workflow_dispatch:
    inputs:
      category:
        description: "Category (empty = automatic). e.g. learn, macro, equities, markets, digital-assets, islamic-finance"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generate-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate
        env:
          CATEGORY: ${{ inputs.category || (github.event.schedule == '0 8 * * 6' && 'learn') || '' }}
          SESSION: ${{ github.event.schedule == '0 6 * * 1-5' && 'European' || github.event.schedule == '30 12 * * 1-5' && 'US' || '' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DRAFT_MODE: ${{ vars.DRAFT_MODE || 'false' }}
          ARTICLES_PER_RUN: "1"
      - name: Commit new articles
        run: |
          git config user.name "armonia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: new generated article(s)"
          git pull --rebase
          git push
