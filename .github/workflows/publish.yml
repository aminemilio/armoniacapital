name: Generate & publish articles

on:
  schedule:
    - cron: "0 6,12,18 * * *"   # 3x/day — 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}          # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate articles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python automation/scripts/generate_articles.py

      - name: Commit & push new articles
        run: |
          git config user.name "armonia-bot"
          git config user.email "bot@armoniacapital.com"
          git add automation/articles automation/state
          git diff --cached --quiet || git commit -m "Auto: new articles $(date -u +%Y-%m-%d\ %H:%M)"
          git push
        # Cloudflare Pages / GitHub Pages auto-deploys on this push — no extra step needed
