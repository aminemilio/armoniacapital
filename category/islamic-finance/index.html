<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islamic Finance — Armonia Capital</title>
<meta name="description" content="Islamic Finance coverage from Armonia Capital.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450&family=Inter:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450&family=Inter:wght@400;600&display=swap" rel="stylesheet"></noscript>
<style>
  body{margin:0;background:#F6F4EE;color:#14181D;font-family:'Inter',sans-serif;line-height:1.6;}
  .wrap{max-width:760px;margin:0 auto;padding:56px 24px;}
  a.back{font-size:13px;color:#9C7A3C;text-decoration:none;}
  h1{font-family:'Fraunces',serif;font-weight:450;font-size:clamp(28px,4vw,38px);margin:24px 0 32px;}
  .item{padding:20px 0;border-bottom:1px solid rgba(20,24,29,0.12);}
  .item h3{font-family:'Fraunces',serif;font-weight:450;font-size:19px;margin:0 0 6px;}
  .item a{color:#14181D;text-decoration:none;}
  .item p{font-size:14px;color:#5A6B6B;margin:0;}
  .empty{font-size:15px;color:#5A6B6B;padding:24px 0;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Armonia Capital</a>
  <h1>Islamic Finance</h1>
  <div id="list"><p class="empty">Loading...</p></div>
</div>
<script>
fetch('/articles/index.json').then(r=>r.json()).then(data=>{
  const items = (data.articles||[]).filter(a=>a.category==='Islamic Finance');
  const el = document.getElementById('list');
  if(items.length===0){
    el.innerHTML = '<p class="empty">No Islamic Finance articles published yet — check back soon.</p>';
    return;
  }
  el.innerHTML = items.map(a=>`
    <div class="item">
      <h3><a href="/articles/${a.slug}.html">${a.headline}</a></h3>
      <p>${a.excerpt}</p>
    </div>
  `).join('');
}).catch(()=>{
  document.getElementById('list').innerHTML = '<p class="empty">Could not load articles right now.</p>';
});
</script>
</body>
</html>
