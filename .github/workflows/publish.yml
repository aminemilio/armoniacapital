name: Generate & publish articles

on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate articles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_articles.py

      - name: Commit & push new articles
        run: |
          git config user.name "armonia-bot"
          git config user.email "bot@armoniacapital.com"
          git add articles state
          git diff --cached --quiet || git commit -m "Auto: new articles $(date -u +%Y-%m-%d\ %H:%M)"
          git push
