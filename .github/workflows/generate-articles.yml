name: Generate articles

on:
  schedule:
    - cron: "0 6 * * *" # once a day at 06:00 UTC (Saturdays: a Learn guide)
  workflow_dispatch:
    inputs:
      category:
        description: "Category (empty = automatic). e.g. learn, macro, equities, markets, digital-assets, islamic-finance"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generate-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate
        env:
          CATEGORY: ${{ inputs.category || '' }}
          FEATURED: ${{ vars.FEATURED || 'true' }}
          BRIEFING: ${{ vars.BRIEFING || 'true' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://armoniacapital.com' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_LIGHT_MODEL: ${{ vars.GROQ_LIGHT_MODEL || 'openai/gpt-oss-20b' }}
          RESEARCH_PASSES: ${{ vars.RESEARCH_PASSES || '2' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DRAFT_MODE: ${{ vars.DRAFT_MODE || 'false' }}
          ARTICLES_PER_RUN: "1"
      - name: Commit new articles
        if: always()
        run: |
          git config user.name "armonia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: new generated article(s)"
          git pull --rebase
          git push
      - name: Send the briefing email
        if: always()
        run: npm run send-briefing
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ vars.RESEND_SEGMENT_ID }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL || 'https://armoniacapital.com' }}
          SEND_BRIEFING: ${{ vars.SEND_BRIEFING || 'true' }}
